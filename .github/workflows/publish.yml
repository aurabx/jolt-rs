# Publishes harmony-jolt to crates.io when a version tag such as 0.11.0 is pushed.
#
# Authentication uses crates.io Trusted Publishing (OIDC), so no crates.io token
# is stored in GitHub. The crates.io trusted publisher for this crate must name
# this repository, this workflow file (publish.yml) and the `release` environment.
#
# The checks below are not a security boundary: a tag-push run uses the workflow
# file from the tagged commit, so anyone who can push a tag can change them. The
# boundary is the `release` environment (required reviewers, tag-only deployment
# rule) and the tag ruleset. See DEVELOPER.md, "Releasing".
name: Publish to crates.io

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions: {}

# A crates.io version can never be replaced, so never run two publishes at once.
concurrency:
  group: publish-crates-io
  cancel-in-progress: false

jobs:
  # Runs every build script and test with no OIDC permission, so dependency
  # code can never mint a crates.io publish token.
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the tag can be checked against main.
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Check the tag matches the Cargo.toml version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 --locked | jq -r '.packages[] | select(.name == "harmony-jolt") | .version')
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

      - name: Check the tagged commit is on main
        run: |
          if ! git rev-parse --verify --quiet origin/main >/dev/null; then
            echo "::error::origin/main is missing from the checkout"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main"
            exit 1
          fi

      - name: Test
        run: cargo test --locked

      - name: Package and build the crate as it will be published
        run: cargo publish --dry-run --locked

  # Holds the OIDC permission. It runs no build code: the package was built
  # and verified in the verify job, so publish skips verification.
  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth

      - name: Publish
        run: cargo publish --locked --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
